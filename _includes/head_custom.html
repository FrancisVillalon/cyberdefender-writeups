<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%9B%A1%EF%B8%8F</text></svg>">

<style>
  .site-header {
    display: flex !important;
    flex-direction: column;
    align-items: center;
    height: auto !important;
    max-height: none !important;
    min-height: 0 !important;
    padding: 40px 16px 28px 16px !important;
    border-bottom: 1px solid rgba(128, 128, 128, 0.25) !important;
    text-align: center;
  }

  .site-title {
    font-size: 17px !important;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding: 0 !important;
    line-height: 1.3 !important;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .site-title::before {
    content: "🛡";
    font-size: 18px;
  }

  .site-title.profile-title {
    flex-direction: column;
    gap: 4px;
    width: 100%;
  }

  .site-title.profile-title::before {
    content: none;
  }

  .profile-avatar {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.12);
    margin-bottom: 14px;
  }

  .profile-name {
    font-size: 19px;
    font-weight: 700;
  }

  .profile-brand {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.55;
    margin-top: 2px;
  }

  .profile-links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    font-size: 13px;
  }

  .profile-links a {
    color: #a996f5;
    text-decoration: none;
  }

  .profile-links a:hover {
    text-decoration: underline;
  }

  .profile-links-sep {
    opacity: 0.4;
  }

  .aux-nav {
    font-size: 14px !important;
  }

  .aux-nav-list-item .site-button,
  .aux-nav-list-item a {
    font-weight: 500;
  }

  .breadcrumb-nav-list-item {
    font-size: 15px !important;
  }

  .breadcrumb-nav-list-item::after {
    font-size: 15px;
  }

  .nav-list .nav-list-item > .nav-list {
    display: block !important;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.28s ease;
  }

  .nav-list .nav-list-item.active > .nav-list {
    max-height: 1200px;
    transition: max-height 0.4s ease;
  }

  .nav-list-expander svg {
    transition: transform 0.25s ease;
  }

  .nav-list-item > .nav-list-link {
    cursor: pointer;
  }

  .gh-alert {
    border-left-width: 4px !important;
    border-radius: 0 6px 6px 0;
    padding: 12px 16px !important;
  }

  .gh-alert-title {
    margin: 0 0 6px 0 !important;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .gh-alert-note { border-left-color: #4493f8 !important; background: rgba(68, 147, 248, 0.1) !important; }
  .gh-alert-tip { border-left-color: #3fb950 !important; background: rgba(63, 185, 80, 0.1) !important; }
  .gh-alert-important { border-left-color: #ab7df8 !important; background: rgba(171, 125, 248, 0.1) !important; }
  .gh-alert-warning { border-left-color: #d29922 !important; background: rgba(210, 153, 34, 0.1) !important; }
  .gh-alert-caution { border-left-color: #f85149 !important; background: rgba(248, 81, 73, 0.1) !important; }

  .gh-alert-note .gh-alert-title { color: #4493f8; }
  .gh-alert-tip .gh-alert-title { color: #3fb950; }
  .gh-alert-important .gh-alert-title { color: #ab7df8; }
  .gh-alert-warning .gh-alert-title { color: #d29922; }
  .gh-alert-caution .gh-alert-title { color: #f85149; }

  .whoami {
    margin: 32px 0;
    border: 1px solid rgba(128, 128, 128, 0.3);
    border-radius: 8px;
    overflow: hidden;
    background: rgba(128, 128, 128, 0.05);
    font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  }

  .whoami-titlebar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: rgba(128, 128, 128, 0.12);
    border-bottom: 1px solid rgba(128, 128, 128, 0.3);
  }

  .whoami-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .whoami-dot-red { background: #ff5f56; }
  .whoami-dot-yellow { background: #ffbd2e; }
  .whoami-dot-green { background: #27c93f; }

  .whoami-titletext {
    margin-left: 8px;
    font-size: 12px;
    opacity: 0.6;
  }

  .whoami-body {
    padding: 18px 20px;
    font-size: 14px;
    line-height: 1.6;
  }

  .whoami-body p {
    margin: 0 0 6px 0;
  }

  .whoami-prompt {
    color: #27c93f;
  }

  .whoami-name {
    font-size: 17px;
    font-weight: 600;
    margin-top: 10px !important;
  }

  .whoami-focus {
    opacity: 0.6;
    margin-bottom: 14px !important;
  }

  .whoami-bio {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    opacity: 0.85;
    margin-bottom: 14px !important;
  }

  .whoami-links a {
    margin-right: 16px;
    color: #7253ed;
  }

  .side-bar .nav-list-link,
  .site-nav .nav-list-link {
    font-size: 15px !important;
    padding-top: 7px !important;
    padding-bottom: 7px !important;
    color: rgba(255, 255, 255, 0.75) !important;
  }

  .side-bar .nav-list-link:hover,
  .site-nav .nav-list-link:hover {
    color: rgba(255, 255, 255, 0.95) !important;
  }

  .side-bar .nav-list-link.active {
    color: #ffffff !important;
    font-weight: 600;
  }

  .writeup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin: 32px 0;
  }

  .writeup-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    min-height: 76px;
    padding: 14px 16px;
    border: 1px solid rgba(128, 128, 128, 0.3);
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .writeup-card:hover {
    border-color: #7253ed;
    transform: translateY(-2px);
  }

  .writeup-card-title {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .difficulty-pill {
    align-self: flex-start;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .difficulty-easy {
    color: #27c93f;
    background: rgba(39, 201, 63, 0.15);
  }

  .difficulty-medium {
    color: #ffbd2e;
    background: rgba(255, 189, 46, 0.15);
  }

  .difficulty-hard {
    color: #ff5f56;
    background: rgba(255, 95, 86, 0.15);
  }

  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    margin: 32px 0;
  }

  .category-card {
    display: flex;
    flex-direction: column;
    padding: 20px;
    border: 1px solid rgba(128, 128, 128, 0.3);
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .category-card:hover {
    border-color: #7253ed;
    transform: translateY(-2px);
  }

  .category-card .category-card-title {
    margin: 0 0 8px 0;
    font-size: 16px;
    font-weight: 600;
  }

  .category-card p {
    margin: 0 0 12px 0;
    font-size: 13px;
    opacity: 0.75;
    line-height: 1.5;
  }

  .category-card .category-count {
    margin-top: auto;
    padding-top: 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.55;
  }

  #page-toc {
    position: fixed;
    top: 100px;
    right: 24px;
    width: 220px;
    max-height: calc(100vh - 140px);
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.5;
    z-index: 5;
  }

  #page-toc .page-toc-title {
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.05em;
    opacity: 0.6;
    margin-bottom: 8px;
  }

  #page-toc ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border-left: 1px solid rgba(128, 128, 128, 0.3);
  }

  #page-toc li {
    margin: 0;
  }

  #page-toc a {
    display: block;
    padding: 3px 0 3px 12px;
    color: inherit;
    opacity: 0.65;
    text-decoration: none;
    border-left: 2px solid transparent;
    margin-left: -1px;
  }

  #page-toc a:hover {
    opacity: 1;
  }

  #page-toc a.toc-h1 {
    font-weight: 600;
    opacity: 0.85;
  }

  #page-toc a.toc-h2 {
    padding-left: 24px;
  }

  #page-toc a.toc-h3 {
    padding-left: 36px;
  }

  #page-toc a.active {
    opacity: 1;
    border-left: 2px solid #7253ed;
  }

  @media (max-width: 1400px) {
    #page-toc {
      display: none;
    }
  }

  .tag-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 4px 0 32px 0 !important;
  }

  .tag-pill {
    font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(114, 83, 237, 0.14);
    color: #a996f5;
    white-space: nowrap;
  }

  .main-content h1 {
    margin-top: 52px !important;
    padding-top: 24px !important;
    border-top: 1px solid rgba(128, 128, 128, 0.2);
  }

  .main-content h1:first-of-type {
    margin-top: 0 !important;
    padding-top: 0 !important;
    border-top: none;
  }

  .main-content h2 {
    margin-top: 36px !important;
    padding-left: 12px;
    border-left: 3px solid rgba(114, 83, 237, 0.45);
  }

  .main-content h3 {
    margin-top: 28px !important;
  }

  .main-content p {
    line-height: 1.7;
  }

  .main-content blockquote {
    border-left: 3px solid #7253ed;
    background: rgba(114, 83, 237, 0.08);
    padding: 10px 16px;
    border-radius: 0 6px 6px 0;
    margin: 16px 0 !important;
  }

  .main-content blockquote p {
    margin: 0 !important;
    opacity: 0.85;
  }

  .main-content p:has(> em:only-child) {
    font-size: 12px;
    opacity: 0.6;
    text-align: center;
    margin-top: 4px !important;
    margin-bottom: 28px !important;
  }

  .main-content p:has(> img:only-child) {
    text-align: center;
    margin-bottom: 4px !important;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var siteTitle = document.querySelector(".site-title");
    if (!siteTitle) return;

    siteTitle.innerHTML = "";
    siteTitle.classList.add("profile-title");

    var avatar = document.createElement("img");
    avatar.className = "profile-avatar";
    avatar.src = "https://github.com/FrancisVillalon.png";
    avatar.alt = "";
    siteTitle.appendChild(avatar);

    var name = document.createElement("span");
    name.className = "profile-name";
    name.textContent = "Francis Villalon";
    siteTitle.appendChild(name);

    var brand = document.createElement("span");
    brand.className = "profile-brand";
    brand.textContent = "Cybersecurity";
    siteTitle.appendChild(brand);

    var links = document.createElement("div");
    links.className = "profile-links";
    links.innerHTML =
      '<a href="https://github.com/FrancisVillalon" target="_blank" rel="noopener">GitHub</a>' +
      '<span class="profile-links-sep">&middot;</span>' +
      '<a href="https://linkedin.com/in/francisvillalon" target="_blank" rel="noopener">LinkedIn</a>';
    siteTitle.insertAdjacentElement("afterend", links);
  });

  document.addEventListener("DOMContentLoaded", function () {
    var content = document.querySelector(".main-content");
    if (!content) return;

    var firstP = content.querySelector("p");
    if (firstP) {
      var tagText = firstP.textContent.trim();
      if (/^(#\S+\s*)+$/.test(tagText)) {
        var tags = tagText.split(/\s+/).filter(Boolean);
        firstP.textContent = "";
        firstP.className = "tag-pills";
        tags.forEach(function (tag) {
          var span = document.createElement("span");
          span.className = "tag-pill";
          span.textContent = tag;
          firstP.appendChild(span);
        });
      }
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    var content = document.querySelector(".main-content");
    if (!content) return;

    var headings = content.querySelectorAll("h1, h2, h3");
    if (headings.length < 2) return;

    var toc = document.createElement("nav");
    toc.id = "page-toc";

    var title = document.createElement("div");
    title.className = "page-toc-title";
    title.textContent = "On this page";
    toc.appendChild(title);

    var list = document.createElement("ul");

    headings.forEach(function (heading, i) {
      if (!heading.id) {
        heading.id = "toc-heading-" + i;
      }
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "#" + heading.id;
      a.textContent = heading.textContent.trim().replace(/\s*#\s*$/, "");
      a.className = "toc-" + heading.tagName.toLowerCase();
      a.dataset.target = heading.id;
      li.appendChild(a);
      list.appendChild(li);
    });

    toc.appendChild(list);
    document.body.appendChild(toc);

    var links = toc.querySelectorAll("a");
    var observer = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          var link = toc.querySelector('a[data-target="' + entry.target.id + '"]');
          if (!link) return;
          if (entry.isIntersecting) {
            links.forEach(function (l) { l.classList.remove("active"); });
            link.classList.add("active");
          }
        });
      },
      { rootMargin: "0px 0px -70% 0px" }
    );

    headings.forEach(function (heading) {
      observer.observe(heading);
    });
  });

  document.addEventListener("DOMContentLoaded", function () {
    var alertLabels = {
      NOTE: "Note",
      TIP: "Tip",
      IMPORTANT: "Important",
      WARNING: "Warning",
      CAUTION: "Caution"
    };
    var alertIcons = {
      NOTE: "ℹ️",
      TIP: "💡",
      IMPORTANT: "❗",
      WARNING: "⚠️",
      CAUTION: "🛑"
    };

    document.querySelectorAll(".main-content blockquote").forEach(function (bq) {
      var p = bq.querySelector("p:first-child");
      if (!p || !p.firstChild || p.firstChild.nodeType !== Node.TEXT_NODE) return;

      var text = p.firstChild.textContent;
      var match = text.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i);
      if (!match) return;

      var type = match[1].toUpperCase();
      p.firstChild.textContent = text.slice(match[0].length);

      bq.classList.add("gh-alert", "gh-alert-" + type.toLowerCase());

      var title = document.createElement("p");
      title.className = "gh-alert-title";
      title.textContent = alertIcons[type] + " " + alertLabels[type];
      bq.insertBefore(title, bq.firstChild);
    });
  });
</script>
